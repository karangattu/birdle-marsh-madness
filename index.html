<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Birdle: Marsh Madness</title>
    <link rel="icon" type="image/png" href="assets/birdle_logo.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="theme-color" content="#06211b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Birdle" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <!-- Splash -->
      <section class="screen screen-splash is-active" id="splashScreen" aria-label="Splash screen">
        <img class="splash-poster" src="assets/marsh_madness_poster.png" alt="Birdle: Marsh Madness poster" />
        <div class="splash-bottom-bar">
          <div class="splash-actions" aria-label="Start or learn the game">
            <button id="splashStart" class="primary-action" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3-1.73l11 7a2 2 0 0 1 0 3.46l-11 7A2 2 0 0 1 5 19z" /></svg>
              Start
            </button>
            <button id="splashHowTo" class="ghost-action" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><path d="M12 17h.01" /></svg>
              How to play
            </button>
          </div>
          <p class="splash-best" id="splashBest" hidden></p>
        </div>
      </section>

      <!-- Intro -->
      <section class="screen screen-intro" id="introScreen" aria-label="Marsh Madness intro" hidden>
        <video id="introVideo" class="intro-video" src="assets/marsh_madness_intro_optimized.mp4" poster="assets/poster.png" muted playsinline preload="metadata"></video>
        <div class="intro-shade"></div>
        <button id="introSkip" class="intro-skip ghost-action" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 4 10 8-10 8V4Z" /><path d="M19 5v14" /></svg>
          Skip
        </button>
      </section>

      <!-- Tutorial -->
      <section class="screen screen-tutorial" id="tutorialScreen" aria-label="How to play" hidden>
        <div class="tutorial-card visual-tutorial">
          <h2>Try one sighting</h2>
          <div class="tutorial-demo" id="tutorialDemo" role="application" aria-label="Practice dragging the eyepiece to the Mallard">
            <img class="tutorial-demo-bg" src="assets/marsh_backdrop.png" alt="" />
            <img class="tutorial-demo-bird" src="assets/mallard.png" alt="Mallard" />
            <div class="tutorial-demo-scope" id="tutorialDemoScope"><div class="eyepiece-glare"></div></div>
            <img class="tutorial-demo-tool" src="assets/looking_through_scope.png" alt="" />
          </div>
          <div class="tutorial-cues">
            <div class="tutorial-cue">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20" /><path d="M2 12h20" /><path d="m19 15 3-3-3-3" /><path d="m5 9-3 3 3 3" /><path d="m15 5-3-3-3 3" /><path d="m9 19 3 3 3-3" /></svg>
              Drag the scope
            </div>
            <div class="tutorial-cue">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
              Find the bird in the eyepiece
            </div>
            <div class="tutorial-cue">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
              Guess from the buttons
            </div>
          </div>
          <p class="tutorial-zoom-note">Game zoom: <strong>4.2x</strong></p>
          <div class="tutorial-demo-buttons">
            <button class="bird-button demo-button" id="demoMallardButton" type="button">Mallard</button>
            <button class="bird-button demo-button dim" type="button">Great Egret</button>
            <button class="bird-button demo-button dim" type="button">Song Sparrow</button>
          </div>
          <div class="tutorial-actions">
            <button id="tutorialStart" class="primary-action" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3-1.73l11 7a2 2 0 0 1 0 3.46l-11 7A2 2 0 0 1 5 19z" /></svg>
              Start round
            </button>
            <button id="tutorialBack" class="ghost-action" type="button">Back</button>
          </div>
        </div>
      </section>

      <!-- Game -->
      <section class="screen screen-game" id="gameScreen" aria-label="Game in progress" hidden>
        <header class="top-bar">
          <h1 class="brand-title">Birdle <span>:</span> Marsh Madness</h1>
          <div class="hud">
            <div class="analog-timer" id="analogTimer" aria-label="60 seconds remaining">
              <svg class="timer-dial" viewBox="0 0 100 100" aria-hidden="true">
                <circle class="timer-track" cx="50" cy="50" r="43" pathLength="100" />
                <circle class="timer-progress" cx="50" cy="50" r="43" pathLength="100" />
                <line class="timer-hand" x1="50" y1="50" x2="50" y2="18" />
                <circle class="timer-pin" cx="50" cy="50" r="3" />
              </svg>
              <strong id="timeRemaining">60</strong>
            </div>
            <div class="hud-meter">
              <span>Found</span><strong id="foundCount">0/0</strong>
            </div>
            <div class="hud-meter">
              <span>Misses</span><strong id="misses">0</strong>
            </div>
          </div>
        </header>

        <div class="playfield">
          <div class="marsh-stage" id="marshStage">
            <div class="marsh-content distant" id="distantContent">
              <img class="marsh-backdrop" src="assets/marsh_backdrop.png" alt="" />
              <div class="bird-layer" id="distantBirds"></div>
              <div class="distant-fog" aria-hidden="true"></div>
            </div>
            <div class="magnified-clip" aria-hidden="true">
              <div class="magnified-zoom" id="magnifiedContent">
                <img class="marsh-backdrop" src="assets/marsh_backdrop.png" alt="" />
                <div class="bird-layer" id="magnifiedBirds"></div>
              </div>
            </div>
            <div class="eyepiece" id="eyepiece">
              <div class="eyepiece-glare"></div>
            </div>
            <img class="scope-decoration" src="assets/looking_through_scope.png" alt="" aria-hidden="true" />
            <div class="scope-hint" id="scopeHint">Drag anywhere on the marsh to look around</div>
            <div class="feedback" id="feedback" aria-live="polite"></div>
          </div>
        </div>

        <section class="controls-panel">
          <div class="controls-actions" hidden aria-hidden="true">
            <button id="restartButton" class="ghost-action" type="button">Restart round</button>
            <button id="howToButton" class="ghost-action" type="button">How to play</button>
          </div>
          <div class="bird-buttons" id="birdButtons" role="group" aria-label="Identify the bird in the eyepiece"></div>
        </section>
      </section>

      <!-- Result -->
      <section class="screen screen-result" id="resultScreen" aria-label="Round results" hidden>
        <div class="result-card">
          <h2 id="resultTitle">Round complete</h2>
          <p class="result-stats" id="resultStats"></p>
          <p class="result-best" id="resultBest"></p>
          <p class="result-support" id="resultSupport"></p>
          <div class="result-actions">
            <button id="resultRestart" class="primary-action" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
              Play again
            </button>
            <button id="resultHome" class="ghost-action" type="button">Home</button>
          </div>
        </div>
      </section>
    </main>

    <audio id="tutorialAudio" src="assets/tutorial_sound.mp3" loop preload="auto"></audio>
    <audio id="gameAudio" src="assets/marsh_sounds.mp3" loop preload="auto"></audio>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
