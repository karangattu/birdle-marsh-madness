<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Birdle: Marsh Madness, a one-minute bird identification game."
    />
    <title>Birdle: Marsh Madness</title>
    <link rel="icon" href="assets/birdle_logo.png" type="image/png" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-labelledby="game-title">
      <header class="top-bar">
        <div class="brand-lockup" aria-label="Birdle: Marsh Madness">
          <h1 id="game-title">Birdle: Marsh Madness</h1>
        </div>

        <div class="hud" aria-live="polite">
          <div class="hud-meter">
            <span class="hud-label">Time</span>
            <strong id="timeRemaining">60</strong>
          </div>
          <div class="hud-meter">
            <span class="hud-label">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="hud-meter">
            <span class="hud-label">Misses</span>
            <strong id="misses">0</strong>
          </div>
        </div>
      </header>

      <section class="playfield" aria-label="Marsh bird sighting area">
        <div class="marsh-stage" id="marshStage">
          <img id="birdSprite" class="bird-sprite" alt="" draggable="false" />
          <img
            src="assets/looking_through_scope.png"
            alt=""
            class="scope-overlay"
            draggable="false"
          />
          <div class="feedback" id="feedback" aria-live="assertive"></div>
        </div>
      </section>

      <section class="controls-panel" aria-label="Bird identification buttons">
        <div class="round-actions">
          <button type="button" id="startButton" class="primary-action">Start</button>
          <button type="button" id="restartButton" class="secondary-action" hidden>Restart</button>
        </div>
        <div class="bird-buttons" id="birdButtons"></div>
      </section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
